server {
    listen 80;
    server_name metrics.ltran.co;

    client_max_body_size 2M;

    # iOS Shortcut -> Go shim. Bearer token is enforced by the shim itself.
    location = /ingest {
        proxy_pass http://127.0.0.1:8081/ingest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana Cloud -> VictoriaMetrics READ API only, behind basic auth.
    # Write and admin endpoints on 8428 stay unreachable from outside.
    location ~ ^/api/v1/(query|query_range|series|labels|label/[^/]+/values|metadata|status/buildinfo)$ {
        auth_basic "metrics";
        auth_basic_user_file /etc/nginx/.htpasswd-metrics;

        proxy_pass http://127.0.0.1:8428;
        proxy_set_header Host $host;
        proxy_read_timeout 60;
    }

    location / {
        return 404;
    }
}
