# One server block on both ports, deliberately.
#
# TLS for metrics.ltran.co terminates at Cloudflare (the record is proxied), and Cloudflare
# may talk to this origin over either 80 or 443 depending on its SSL mode. Serving identical
# locations on both means neither mode breaks, and there's no 80->443 redirect to loop
# against Flexible mode.
#
# The 443 listener is declared here rather than left to `certbot --nginx` to bolt on. It used
# to be certbot's, and deploy.sh's `cp` of this file silently deleted it on every deploy --
# the vhost only survived until the next nginx reload, at which point metrics.ltran.co fell
# through to gold's 443 block and Django answered 400. Keeping it in the repo makes the
# deployed config complete and idempotent.
server {
    listen 80;
    listen 443 ssl;
    server_name metrics.ltran.co;

    ssl_certificate /etc/letsencrypt/live/metrics.ltran.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metrics.ltran.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2M;

    # iOS Shortcut -> Go shim. Bearer token is enforced by the shim itself.
    location = /ingest {
        proxy_pass http://127.0.0.1:8081/ingest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # VictoriaMetrics READ API only. Write and admin endpoints on 8428 stay unreachable
    # from outside -- in particular admin/tsdb/delete_series, which is why corrections are
    # made by appending rather than deleting.
    #
    # Two ways in, deliberately. Grafana Cloud uses basic auth. Clients that already hold
    # the ingest bearer token use that instead: $metrics_auth resolves to the special realm
    # "off" for a matching Bearer header, which disables auth_basic for that request, and to
    # the realm name for everything else. Generated into /etc/nginx/conf.d by deploy.sh from
    # $APP_DIR/.env, so the token has exactly one home and is never committed.
    #
    # `export` is here so a client can read back raw samples. query_range can't substitute:
    # it evaluates on a fixed grid, and -search.maxStalenessInterval=720h carries values
    # forward for 30 days, so it invents points that were never recorded.
    location ~ ^/api/v1/(query|query_range|export|series|labels|label/[^/]+/values|metadata|status/buildinfo)$ {
        auth_basic $metrics_auth;
        auth_basic_user_file /etc/nginx/.htpasswd-metrics;

        proxy_pass http://127.0.0.1:8428;
        proxy_set_header Host $host;
        proxy_read_timeout 60;
    }

    location / {
        return 404;
    }
}
